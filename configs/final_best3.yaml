# Experiment after the holdout evaluation, checked on dev only.
# 1. final_best2 plus routing.out_of_scope_search: an "out of scope" label still searches, and the self-check
#    refuses only when no source scores well (the router had refused two answerable holdout questions).
extends: base.yaml

retrieval:
  auto_course_filter: true

routing:
  out_of_scope_search: true

generation:
  llm_model: llama3.1:8b
  course_split: true
